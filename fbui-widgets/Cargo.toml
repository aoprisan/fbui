[package]
name = "fbui-widgets"
version.workspace = true
description = "fbui widget toolkit: a retained widget tree with an Elm-ish update(msg) -> state -> damage -> paint loop, taffy flexbox/grid layout, and a software-rendered widget set (Label, Button, Checkbox, Slider, TextInput, containers, ScrollView, List, Image). Headless by design; draws through fbui-render's Painter."
edition.workspace = true
# Tracks fbui-render's heavier-dep MSRV floor (cosmic-text 1.89).
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std", "harness"]
# The hosted build. Off (`default-features = false`) the crate is
# `no_std + alloc` for bare-metal targets — the whole widget tree, layout,
# focus, gestures and animation, minus what needs files or threads: the flow
# harness, screenshot requests and `profile` tracing. See NOSTD.md.
std = ["fbui-render/std", "taffy/std", "taffy/detailed_layout_info", "slotmap/std"]
# Flow scripts and the in-process test harness: the `fbui-rec 2` parser, the
# reference resolver, and an executor that drives a `Ui` through the same
# `Event` path the behavior tests use. On by default because the umbrella
# runner needs it and because an off-by-default parser is an untested one;
# `default-features = false` drops it for a minimal embedded build.
harness = ["std"]
# Emit `tracing` spans through the event → layout → paint pipeline so an app can
# capture a flamegraph of a frame. Off by default (and zero-cost when off).
profile = ["std", "dep:tracing"]

[dependencies]
fbui-render = { path = "../fbui-render", default-features = false }
# Default features off for the no_std build; `std` above restores them. The
# explicit set is taffy's default minus `std` and `detailed_layout_info` (taffy
# 0.11 doesn't build that one without std; fbui doesn't read it — `std` restores
# it so the hosted build is taffy's full default).
taffy = { version = "0.11", default-features = false, features = [
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "calc",
    "content_size",
    "alloc",
] }
slotmap = { version = "1", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
# The tests pull in the compiled-in font so text metrics — and therefore the
# laid-out bounds a tree dump prints — are identical on every host. Without a
# pinned font a golden dump would be a golden of whatever fonts CI happens to
# have installed.
fbui-render = { path = "../fbui-render", features = ["bundled-font"] }
fbui-testkit = { path = "../fbui-testkit" }
criterion = { version = "0.5", default-features = false }
# Used by the `all_widgets` example to build a procedural bitmap for ImageView.
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "scroll"
harness = false
