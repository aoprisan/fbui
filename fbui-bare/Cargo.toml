[package]
name = "fbui-bare"
version.workspace = true
description = "fbui on bare metal: a no_std + alloc app runner that drives the fbui widget tree on any linear framebuffer a board can hand it — no OS, no Linux, no event loop. The board supplies three things (a Framebuffer, an input poll, a millisecond clock); the runner does event → update → layout → paint → damaged-span copy-out, and sleeps between frames. See NOSTD.md."
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["outline-text"]
# Outline text: cosmic-text shaping and swash rasterization, from TTF/OTF
# fonts (`App::static_fonts` / `App::fonts`). On by default. A firmware that
# sets all its text in bitmap fonts (`App::bitmap_fonts`) can turn default
# features off and leave the shaping engine out of the image.
outline-text = ["fbui-render/outline-text", "fbui-widgets/outline-text"]
# Compile in fbui-render's default font (Inter, ~300 KB) so an app that
# returns no fonts still has legible text.
bundled-font = ["outline-text", "fbui-render/bundled-font"]
# Compile in pre-rasterized Inter (12/16/20/24 px, Latin-1, ~75 KB) and use
# it when an app supplies no fonts: text with no font file or shaping engine.
bundled-bitmap-font = ["fbui-render/bundled-bitmap-font"]
# The full widget set. Off by default: a firmware image gets fbui-widgets'
# minimal set (Label, Button, Container, Stack, ScrollView, List, ImageView,
# ProgressBar) and opts into the rest only if it needs them.
all-widgets = ["fbui-widgets/all-widgets"]

[dependencies]
fbui-render = { workspace = true }
fbui-widgets = { workspace = true }
