[package]
name = "fbui-render"
version.workspace = true
description = "fbui rendering layer: a headless, CPU software renderer for Linux framebuffer UIs. A tiny-skia painter (rects, paths, gradients, clipping, opacity groups, image blit), cosmic-text/swash text with a bounded glyph atlas, damage tracking, fractional scale, and a damaged-span copy-out into any platform back buffer. Depends on fbui-platform only behind the `platform` feature."
edition.workspace = true
# Not the workspace's 1.76: cosmic-text (1.89) and image (1.88) pull the floor up.
# fbui-platform keeps the lower MSRV; the render stack tracks its heavier deps.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[features]
# Core is headless and self-contained: it draws into a normal-RAM shadow buffer
# and knows how to copy damaged spans into a caller-supplied byte target. None of
# that needs a kernel device, so the default build pulls in no platform code.
default = ["std", "outline-text"]

# `std` is the full, hosted build — on by default and what every Linux target
# uses. Turning it off (`default-features = false`) gives a `no_std + alloc`
# build for bare-metal targets (see NOSTD.md): the painter, damage, copy-out,
# rotation and text (from in-memory fonts) all keep working; what goes is the
# `image`-crate codecs (`Image::from_encoded`/`open`/`from_rgba`), PNG export,
# and file paths. Float math falls back to `libm` through `math::F32Ext`.
std = [
    "dep:image",
    "tiny-skia/std",
    "tiny-skia-path/std",
    "tiny-skia/simd",
    "cosmic-text?/std",
    "cosmic-text?/fontconfig",
]

# Outline text: cosmic-text shaping and swash rasterization — any size, any
# script, kerning and ligatures. On by default. Without it text comes only
# from bitmap fonts (`text::bitmap`), and cosmic-text, swash and harfrust
# leave the binary; a `FontContext` with no bitmap fonts lays text out empty.
outline-text = ["dep:cosmic-text"]

# The `platform` feature adds the one coupling point PLAN/PHASE1 promised: a
# `present()` glue that drives an `fbui_platform::Display` (begin_frame ->
# copy-out -> present). It is opt-in so the core stays headless-by-design.
platform = ["std", "dep:fbui-platform"]

# Compile in a default font (Inter Regular, OFL) so a target with no installed
# fonts can render text turnkey via `FontContext::with_default_font`. Off by
# default — it adds ~300 KB to the binary; apps that bundle their own font don't
# pay for it. The font + its license live in `fonts/`.
bundled-font = ["outline-text"]

# Compile in pre-rasterized bitmap fonts (Inter Regular at 12, 16, 20 and
# 24 px, Latin-1, ~60 KB) for `FontContext::with_default_bitmap_fonts`: text
# with no font file, shaping engine or rasterizer. Works without
# `outline-text`. Regenerate with the `make_bitmap_font` example.
bundled-bitmap-font = []

# SVG icon support: `Image::from_svg`/`from_svg_file` rasterize an SVG at a
# caller-chosen pixel size through resvg (which rasterizes with tiny-skia, the
# same CPU rasterizer the painter uses). Off by default; text-in-SVG and
# raster-images-in-SVG are deliberately not enabled — icons are pure vectors.
svg = ["std", "dep:resvg"]

# docs.rs builds with the optional, pure-Rust features on so every public
# item shows up (the C-library backends stay off: they need system headers).
[package.metadata.docs.rs]
features = ["platform", "bundled-font", "bundled-bitmap-font", "svg"]

[dependencies]
# tiny-skia is the CPU rasterizer; cosmic-text shapes/lays out text and re-exports
# the swash rasterizer + fontdb font loading; image decodes PNG/JPEG for blits.
# All three are pulled with default features off so the no_std build can pick
# their libm-backed float paths; the `std` feature above turns the hosted
# defaults back on.
tiny-skia = { version = "0.12", default-features = false, features = ["no-std-float"] }
tiny-skia-path = { version = "0.12", default-features = false, features = ["no-std-float"] }
cosmic-text = { version = "0.19", default-features = false, features = ["swash", "no_std"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# Float math (`floor`, `sin`, …) for the no_std build; with `std` the inherent
# f32 methods shadow the `math::F32Ext` trait and libm goes unused.
libm = "0.2"
# The glyph atlas's map in the no_std build (std uses std's HashMap).
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }

# Only linked when the `svg` feature is enabled. Minimal feature set: no text,
# no raster images inside SVGs, no system fonts — vector icons only.
resvg = { version = "0.47", optional = true, default-features = false }

# Only linked when the `platform` glue is enabled.
fbui-platform = { workspace = true, optional = true }

[dev-dependencies]
# Snapshot tests compare painter output against committed golden PNGs through the
# testkit harness; criterion drives the repaint benchmarks.
fbui-testkit = { workspace = true }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "repaint"
harness = false

[[example]]
name = "make_bitmap_font"
required-features = ["std", "outline-text"]

[[example]]
name = "present"
required-features = ["platform"]
