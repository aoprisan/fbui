[workspace]
resolver = "2"
members = ["fbui-platform", "fbui-render", "fbui-testkit", "fbui-widgets", "fbui"]
# The Phase 0 spike keeps its own lockfile and throwaway deps; it is not part of
# the framework workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/fbui"
homepage = "https://github.com/aoprisan/fbui"
keywords = ["framebuffer", "drm", "kms", "embedded", "gui"]
categories = ["gui", "embedded", "os::linux-apis", "rendering"]

# Intra-workspace dependencies. The `path` is used inside the workspace; the
# `version` is what lands in the published manifest on crates.io. The crates
# release in lockstep (see CHANGELOG.md's versioning policy), so each pins its
# siblings *exactly* — keep this in step with `workspace.package.version`
# (`scripts/release-check.sh` enforces it, and so does the release workflow).
[workspace.dependencies]
fbui-platform = { path = "fbui-platform", version = "=0.3.0" }
fbui-render = { path = "fbui-render", version = "=0.3.0" }
fbui-widgets = { path = "fbui-widgets", version = "=0.3.0" }
fbui-testkit = { path = "fbui-testkit", version = "=0.3.0" }

# Release tuned for shipping on an embedded / boot-image target: small and fast.
# `opt-level = 3` keeps the CPU renderer quick (it's the perf-sensitive part);
# LTO + one codegen unit shrink and speed the result; `panic = "abort"` drops the
# unwind tables — safe here because the console is restored by a panic *hook*
# (see fbui-platform `vt.rs`), which runs before abort, not by unwinding `Drop`.
# `strip` removes symbols. Go `opt-level = "s"`/`"z"` if you need the binary even
# smaller and can trade some render throughput. See docs/running-on-your-device.md.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
