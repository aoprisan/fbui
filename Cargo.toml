[workspace]
resolver = "2"
members = ["fbui-platform", "fbui-render", "fbui-testkit", "fbui-widgets", "fbui", "fbui-bare", "fbui-doc", "apps/doc-viewer"]
# Not part of the framework workspace, each with its own lockfile: the Phase 0
# spike (throwaway deps) and the bare-metal board crates (they build only for
# their own targets, so `cargo test --workspace` on the host must not see them).
exclude = ["spikes", "apps/doc-viewer-rpi3"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/fbui"
homepage = "https://github.com/aoprisan/fbui"
keywords = ["framebuffer", "drm", "kms", "embedded", "gui"]
categories = ["gui", "embedded", "os::linux-apis", "rendering"]

# Intra-workspace dependencies. The `path` is used inside the workspace; the
# `version` is what lands in the published manifest on crates.io. The crates
# release in lockstep (see CHANGELOG.md's versioning policy), so each pins its
# siblings *exactly* — keep this in step with `workspace.package.version`
# (`scripts/release-check.sh` enforces it, and so does the release workflow).
[workspace.dependencies]
fbui-platform = { path = "fbui-platform", version = "=0.5.0" }
# Default features off: the render/widget stack is `no_std` without its `std`
# feature (NOSTD.md), and a default here would switch it on for every user.
# Hosted dependents ask for `std` (and the widget defaults) explicitly.
fbui-render = { path = "fbui-render", version = "=0.5.0", default-features = false }
fbui-widgets = { path = "fbui-widgets", version = "=0.5.0", default-features = false }
fbui-testkit = { path = "fbui-testkit", version = "=0.5.0" }
# The no_std track's crates (publish = false for now). Pinned like the rest so
# `cargo package --workspace` can verify the viewer app that uses them.
fbui-bare = { path = "fbui-bare", version = "=0.5.0" }
fbui-doc = { path = "fbui-doc", version = "=0.5.0" }

# Release tuned for shipping on an embedded / boot-image target: small and fast.
# `opt-level = 3` keeps the CPU renderer quick (it's the perf-sensitive part);
# LTO + one codegen unit shrink and speed the result; `panic = "abort"` drops the
# unwind tables — safe here because the console is restored by a panic *hook*
# (see fbui-platform `vt.rs`), which runs before abort, not by unwinding `Drop`.
# `strip` removes symbols. Go `opt-level = "s"`/`"z"` if you need the binary even
# smaller and can trade some render throughput. See docs/running-on-your-device.md.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
