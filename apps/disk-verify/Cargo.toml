[package]
name = "fbui-disk-verify"
version.workspace = true
description = "Example fbui app: verify every sector of a disk against a repeating byte pattern, skipping chosen sector ranges, with a live surface map. Ships as a bootable ISO (scripts/build-iso.sh)."
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbui = { workspace = true, features = ["platform", "bundled-font"] }
# O_DIRECT, so a surface scan reads the media rather than the page cache.
libc = "0.2"

[[bin]]
name = "disk-verify"
path = "src/main.rs"
