# Boot the kernel in a graphics mode — GRUB sets it via VBE (BIOS) or GOP
# (UEFI) — so simpledrm hands it to disk-verify as a DRM device. The menu
# itself stays in text mode.
insmod all_video
set timeout=3

menuentry "disk-verify" {
    set gfxpayload=1024x768,auto
    linux /boot/vmlinuz quiet loglevel=3 console=tty1
    initrd /boot/initrd.img
}

menuentry "disk-verify (1280x800)" {
    set gfxpayload=1280x800,auto
    linux /boot/vmlinuz quiet loglevel=3 console=tty1
    initrd /boot/initrd.img
}
